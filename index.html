<title>زفاف مصطفى ورانيا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#0C211A;
  --bg-lift:#1B4231;
  --wine:#2E1A26;
  --ivory:#FBF3E9;
  --ivory-dim:rgba(251,243,233,.9);
  --blush:#F3C6D0;
  --rose:#D98AA0;
  --rose-deep:#A8455E;
  --gold:#DDBE82;
  --gold-deep:#80622C;
  --paper:#FBF4EA;
  --ink:#1E3328;
  --ink-dim:#566759;
  --line:rgba(221,190,130,.38);
  --wall:rgba(243,198,208,.9);
  --trail:rgba(221,190,130,.42);
  --f-ar-d:"Aref Ruqaa","Amiri",serif;
  --f-ar:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-en-d:"Cormorant Garamond",Georgia,serif;
  --f-en:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:var(--f-ar-d);
  --text:var(--f-ar);
  color-scheme:dark;
}
html[lang="en"]{--disp:var(--f-en-d);--text:var(--f-en)}
*{box-sizing:border-box}
html,body{min-height:100%}
html,body{overflow-x:clip}
body{
  margin:0;background-color:var(--bg);color:var(--ivory);font-family:var(--text);font-size:17px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(110% 60% at 50% -8%,var(--bg-lift) 0%,transparent 62%),
    radial-gradient(70% 45% at 100% 100%,rgba(243,198,208,.13) 0%,transparent 70%),
    radial-gradient(60% 40% at 0% 70%,rgba(221,190,130,.07) 0%,transparent 70%),
    var(--bg);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 110%,rgba(217,138,160,.34) 0%,transparent 65%),linear-gradient(180deg,rgba(46,26,38,0) 0%,var(--wine) 100%);
  opacity:var(--dusk,0);
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#petals{z-index:0}
#burst{z-index:60}
#prog{position:fixed;top:0;left:0;height:2px;width:calc(var(--sp,0)*100%);background:linear-gradient(90deg,var(--rose),var(--gold));z-index:45;pointer-events:none}

/* top controls */
.bar{position:fixed;z-index:40;direction:ltr;pointer-events:none;top:calc(10px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center}
.bar > *{pointer-events:auto}
.pill{height:44px;min-width:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:rgba(12,33,26,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ivory);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:15px;transition:background .2s,border-color .2s}
.pill:hover{background:rgba(27,66,49,.95);border-color:var(--gold)}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill[aria-pressed="true"]{border-color:var(--blush);color:var(--blush)}

/* blossom branches */
.branches{position:fixed;inset:0 0 auto 0;height:260px;z-index:5;pointer-events:none;transition:opacity 1s,visibility 1s}
body.open .branches,body.in-maze .branches{opacity:0;visibility:hidden}
.branch{position:absolute;top:0;width:min(50vw,235px);pointer-events:none}
.branch.l{left:0;transform-origin:0 0;animation:swayL 8s ease-in-out infinite alternate}
.branch.r{right:0;transform-origin:100% 0;animation:swayR 9s ease-in-out infinite alternate}
.branch.r svg{transform:scaleX(-1)}
.branch svg{display:block;width:100%;height:auto;overflow:visible}
.branch .fl .bl{transform-origin:0 0;animation:bloom 1.6s var(--d,0s) cubic-bezier(.2,.9,.3,1.2) both}
@keyframes bloom{from{transform:scale(0) rotate(-70deg);opacity:0}to{transform:none;opacity:1}}
@keyframes swayL{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
@keyframes swayR{from{transform:rotate(1.4deg)}to{transform:rotate(-1.6deg)}}

/* full-screen steps */
.screen{position:fixed;inset:0;z-index:10;overflow-y:auto;display:flex;flex-direction:column;text-align:center;padding:calc(66px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:opacity .9s ease,visibility .9s}
.screen.off{opacity:0;visibility:hidden;pointer-events:none;display:none!important}
.screen .inner{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:16px}
.eyebrow{font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:18px;text-transform:none}
.names{display:flex;flex-direction:column;align-items:center;font-family:var(--disp);line-height:1.25}
.nm{font-size:clamp(58px,18vw,104px);color:#ffffff;font-weight:700;text-shadow:0 4px 30px rgba(243,198,208,.3)}
html[lang="en"] .nm{font-style:italic;font-weight:500;line-height:1}
.amp{font-size:clamp(28px,8vw,42px);font-style:italic;line-height:1.3;background:linear-gradient(100deg,var(--gold) 20%,#fff1cf 50%,var(--gold) 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-100% 0}}
.orn{display:flex;align-items:center;gap:14px;color:var(--gold)}
.orn::before,.orn::after{content:"";width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));transform-origin:center}
.orn::after{background:linear-gradient(270deg,transparent,var(--gold))}
.orn svg{width:18px;height:18px;fill:currentColor;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}60%{transform:scale(1.05)}}
.date-line{font-size:20px;color:#ffffff;font-weight:500}
.teaser{max-width:30ch;color:var(--ivory-dim);font-size:17px}
.small{font-size:15px;color:var(--ivory-dim)}
.btn{border:0;cursor:pointer;border-radius:999px;padding:14px 38px;font-weight:500;font-size:18px;background:linear-gradient(135deg,#f7d3dc,var(--blush) 55%,#e9a9bb);color:var(--ink);transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.glow{animation:glow 2.8s ease-in-out infinite}
.btn.dark{background:var(--ink);color:var(--ivory)}
.btn.dark:hover{background:#2b4636;filter:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.btn.ghost:hover{background:rgba(30,51,40,.06);filter:none}
.btn.sm{padding:10px 22px;font-size:15px}
a.btn{text-decoration:none;display:inline-block}
.btn .pin{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:8px}
.link{background:none;border:0;cursor:pointer;color:var(--ivory-dim);text-decoration:underline;text-underline-offset:4px;font-size:15px;padding:6px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(243,198,208,.42)}50%{box-shadow:0 0 0 16px rgba(243,198,208,0)}}

/* maze */
.maze-title{font-family:var(--disp);font-size:clamp(28px,8vw,40px);line-height:1.4;color:var(--ivory);font-weight:700}
html[lang="en"] .maze-title{font-style:italic;font-weight:500;line-height:1.15}
.card-maze{padding:10px;border-radius:22px;border:1px solid var(--line);background:rgba(251,243,233,.045);box-shadow:0 22px 60px rgba(0,0,0,.3),0 0 60px rgba(221,190,130,.06)}
#maze{display:block;touch-action:none;cursor:grab;border-radius:14px}
#maze:active{cursor:grabbing}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.win{font-family:var(--disp);font-size:26px;color:var(--blush);line-height:1.5}
html[lang="en"] .win{font-style:italic}
.dpad{direction:ltr;display:grid;grid-template-columns:repeat(3,54px);grid-template-areas:". up ." "left down right";gap:8px}
.dp{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:rgba(251,243,233,.06);color:var(--ivory);display:grid;place-items:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transition:background .15s,transform .1s,border-color .15s}
.dp:active,.dp.hold{background:rgba(243,198,208,.22);border-color:var(--blush);transform:scale(.94)}
.dp svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dp.up{grid-area:up}.dp.left{grid-area:left}.dp.down{grid-area:down}.dp.right{grid-area:right}
.dp.left svg{transform:rotate(-90deg)}.dp.right svg{transform:rotate(90deg)}.dp.down svg{transform:rotate(180deg)}

/* envelope */
#env{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 45%,rgba(27,66,49,.94),rgba(12,33,26,.99));transition:opacity 1.1s ease,visibility 1.1s}
#env.out{opacity:0;visibility:hidden}
.envelope{position:relative;width:min(80vw,330px);aspect-ratio:4/3;perspective:1000px;opacity:0;filter:drop-shadow(0 24px 40px rgba(0,0,0,.5))}
#env.go .envelope{animation:envIn .9s cubic-bezier(.2,.8,.2,1) both}
.env-back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#f6d3da,#e5a1b2)}
.env-card{position:absolute;left:7%;right:7%;top:9%;bottom:9%;border-radius:6px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1;box-shadow:inset 0 0 0 1px rgba(201,166,107,.65);padding:6px;font-family:var(--disp);line-height:1.3}
.env-card small{font-family:var(--text);font-size:13px;color:var(--gold-deep)}
.env-card b{font-size:26px;font-weight:700}
html[lang="en"] .env-card b{font-style:italic;font-weight:500}
.env-front{position:absolute;inset:0;border-radius:10px;z-index:2;background:linear-gradient(200deg,#f2c1cc,#db8fa3);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:56%;transform-origin:50% 0;z-index:3;background:linear-gradient(180deg,#f9dce2,#eab0bf);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.env-seal{position:absolute;left:50%;top:54%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e98ba1,#a8455e);z-index:4;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.env-seal svg{width:20px;height:20px;fill:#fbe7ea}
#env.go .env-flap{animation:flapOpen 1s ease-in-out .9s both}
#env.go .env-seal{animation:sealOut .5s ease .85s both}
#env.go .env-card{animation:cardUp 1.1s cubic-bezier(.3,.8,.2,1) 1.8s both}
@keyframes envIn{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@keyframes flapOpen{0%{transform:rotateX(0);z-index:3}49%{z-index:3}50%{z-index:0}100%{transform:rotateX(180deg);z-index:0}}
@keyframes sealOut{to{opacity:0;transform:scale(.4)}}
@keyframes cardUp{from{transform:translateY(0)}to{transform:translateY(-64%) scale(1.06)}}

/* invitation */
#invite{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-top:calc(74px + env(safe-area-inset-top,0px))}
.sec{padding-block:44px;text-align:center;position:relative}
.arch{position:relative;z-index:1;width:min(74vw,290px);aspect-ratio:3/4;margin:0 auto 30px;border-radius:999px 999px 26px 26px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 0 9px #0C211A,0 0 0 10px var(--line),0 0 70px rgba(243,198,208,.18),0 26px 60px rgba(0,0,0,.4);will-change:transform}
.arch img{width:100%;height:100%;object-fit:cover;object-position:52% 40%;display:block}
.hero-branches{position:absolute;top:0;left:calc(50% - min(100vw,760px)/2);width:min(100vw,760px);height:260px;overflow:hidden;pointer-events:none;z-index:0}
.invite-line{color:var(--ivory-dim);margin-bottom:6px;font-size:17px}
.hero-date{font-family:var(--disp);font-size:clamp(26px,7vw,34px);color:var(--ivory);margin-top:12px}
html[lang="en"] .hero-date{font-style:italic}
.hero-place{margin-top:4px;color:var(--blush);font-size:18px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:26px auto 0}
.cd{border:1px solid var(--line);border-radius:16px;padding:12px 4px 8px;background:rgba(251,243,233,.05);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cd b{display:block;font-size:30px;font-weight:500;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--blush)}
.cd b.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}
.cd span{font-size:13px;color:var(--ivory-dim)}
.count-note{margin-top:16px;font-family:var(--disp);font-size:22px;color:var(--blush)}
.verse{font-family:var(--f-ar-d);font-size:clamp(22px,5.4vw,28px);line-height:2;color:var(--ivory);max-width:26em;margin:0 auto}
.verse-en{margin-top:14px;font-family:var(--f-en-d);font-style:italic;font-size:19px;line-height:1.55;color:var(--ivory-dim);max-width:30em;margin-inline:auto}
.verse-src{margin-top:12px;font-size:14px;color:var(--gold)}
h2.h{font-family:var(--disp);font-size:clamp(30px,8vw,40px);font-weight:700;line-height:1.4;margin-bottom:6px}
html[lang="en"] h2.h{font-style:italic;font-weight:500;line-height:1.15}
.h-sub{color:var(--ivory-dim);margin-bottom:24px;font-size:16px}
.paper{color-scheme:light;position:relative;background:var(--paper);color:var(--ink);border-radius:26px;padding:34px 24px 30px;text-align:start;box-shadow:0 24px 70px rgba(0,0,0,.38),0 0 60px rgba(243,198,208,.1)}
.paper::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,166,107,.55);border-radius:19px;pointer-events:none}
.paper h2.h{color:var(--ink);text-align:center}
.paper .h-sub{color:var(--ink-dim);text-align:center}
.rows{display:grid;margin:8px 0 22px}
.rw{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid rgba(30,51,40,.13)}
.rw:first-child{border-top:0}
.rw dt{color:var(--gold-deep);font-size:14px;font-weight:500;padding-top:3px}
.rw dd{margin:0;font-size:18px;line-height:1.6}
.rw dd.tbd{color:var(--ink-dim);font-size:16px}
.paper .row-btns{justify-content:center}

/* 3D photo coverflow */
.ring-wrap{position:relative;width:min(100vw,560px);margin:6px 0 0 calc(50% - min(100vw,560px)/2);overflow-x:clip;perspective:1100px;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;outline-offset:6px}
.ring-wrap.grabbing{cursor:grabbing}
.rc{position:absolute;left:50%;top:50%;margin:0;border-radius:18px;overflow:hidden;background:#0d1812;border:5px solid var(--paper);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(221,190,130,.4);will-change:transform;transform-style:preserve-3d;backface-visibility:hidden}
.rc img{width:100%;height:100%;object-fit:cover;object-position:var(--op,50%) 35%;display:block;pointer-events:none;-webkit-user-drag:none}
.rc::after{content:"";position:absolute;inset:0;background:#0C211A;opacity:var(--sh,0);pointer-events:none}
.ring-ctl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px;direction:ltr}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(251,243,233,.06);color:var(--ivory);cursor:pointer;display:grid;place-items:center}
.rbtn:hover{border-color:var(--blush);color:var(--blush)}
.rbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rcount{min-width:64px;font-variant-numeric:tabular-nums;color:var(--ivory-dim)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:rgba(251,243,233,.3);cursor:pointer;transition:all .3s}
.dots button[aria-current="true"]{background:var(--blush);width:26px;border-radius:5px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(251,243,233,.35);background:rgba(12,33,26,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ivory);cursor:pointer;display:grid;place-items:center;z-index:3}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* lightbox */
.lb{position:fixed;inset:0;z-index:55;display:grid;place-items:center;opacity:0;transition:opacity .35s ease;direction:ltr}
.lb.open{opacity:1}
.lb-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) brightness(.4) saturate(1.2)}
.lb-stage{position:absolute;inset:0;display:grid;place-items:center;padding:calc(64px + env(safe-area-inset-top,0px)) 12px calc(70px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
.kb{display:grid;place-items:center;max-width:100%;max-height:100%;animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.045)}}
#lbImg{max-width:100%;max-height:calc(100vh - 150px);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:block;-webkit-user-drag:none;user-select:none}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:4;width:46px;height:46px;border-radius:50%;border:1px solid rgba(251,243,233,.35);background:rgba(12,33,26,.55);color:var(--ivory);cursor:pointer;display:grid;place-items:center}
.lb-x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.lb .nav.prev{left:max(10px,env(safe-area-inset-left,0px))}.lb .nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-count{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--ivory-dim);font-variant-numeric:tabular-nums;z-index:4}

/* rsvp */
form{display:grid;gap:20px}
label.fl,.fl{display:block;font-size:15px;font-weight:500;margin-bottom:8px;color:var(--ink)}
.in{width:100%;border:1px solid #d6c8b4;background:#fffdf9;border-radius:14px;padding:13px 15px;font:inherit;font-size:17px;color:var(--ink);line-height:1.5}
.in:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea.in{min-height:96px;resize:vertical}
fieldset{border:0;margin:0;padding:0;min-width:0}
.choice{display:grid;gap:10px}
.choice label{display:flex;align-items:center;gap:12px;border:1px solid #d6c8b4;background:#fffdf9;border-radius:14px;padding:13px 15px;cursor:pointer;font-size:17px;transition:border-color .2s,background .2s}
.choice input{accent-color:var(--rose-deep);width:20px;height:20px;margin:0;flex:none}
.choice label:has(input:checked){border-color:var(--rose-deep);background:#fbeef0}
.stepper{display:inline-flex;align-items:center;border:1px solid #d6c8b4;border-radius:14px;background:#fffdf9;overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:transparent;cursor:pointer;font-size:24px;color:var(--ink)}
.stepper button:hover{background:#f3e9da}
.stepper output{min-width:54px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.err{color:#9a2c43;font-size:15px;min-height:1.4em}
.reply{display:grid;gap:14px;text-align:center}
.reply textarea{width:100%;min-height:120px;border:1px solid #d6c8b4;border-radius:14px;background:#fffdf9;padding:13px 15px;font:inherit;font-size:16px;color:var(--ink);line-height:1.7;text-align:start}
.reply .note{color:var(--ink-dim);font-size:15px}
.thanks-h{font-family:var(--disp);font-size:30px;line-height:1.5;color:var(--ink)}

    el.style.zIndex=String(Math.round(100-ad*10));
    el.style.opacity=ad>2.1?String(Math.max(0,1-(ad-2.1)/.4)):"1";
    el.style.setProperty("--sh",Math.min(.62,ad*.34).toFixed(2));
  }
  markGal(false);
}
function galIdx(){return mod(Math.round(pos),N)}
function markGal(force){
  var gi=galIdx();if(!force&&gi===lastGi)return;lastGi=gi;
  var dots=$$("#dots button");
  if(dots.length!==N){var box=$("#dots");box.innerHTML="";for(var i=0;i<N;i++){(function(i){var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",String(i+1));b.addEventListener("click",function(){gUser=true;gTarget=Math.round(pos)+mod(i-gi+N/2,N)-N/2});box.appendChild(b)})(i)}dots=$$("#dots button")}
  dots.forEach(function(b,i){if(i===gi)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
  $("#rCount").textContent=num(gi+1)+" / "+num(N);
}
function galStep(dt){
  if(gDrag)return;
  var diff=gTarget-pos;
  if(Math.abs(diff)>.0008){pos+=diff*(1-Math.exp(-dt*6.5));placeCards()}
  else if(diff!==0){pos=gTarget;placeCards()}
}
ringWrap.addEventListener("pointerdown",function(e){
  gUser=true;gDrag={x:e.clientX,p:pos,lx:e.clientX,lt:performance.now(),v:0,moved:0,card:e.target.closest(".rc")};
  try{ringWrap.setPointerCapture(e.pointerId)}catch(_){}
});
ringWrap.addEventListener("pointermove",function(e){
  if(!gDrag)return;
  var dx=e.clientX-gDrag.x;gDrag.moved=Math.max(gDrag.moved,Math.abs(dx));
  if(gDrag.moved>6)ringWrap.classList.add("grabbing");
  pos=gDrag.p-dx/(cw*.6);gTarget=pos;
  var now=performance.now(),dt=now-gDrag.lt;
  if(dt>0){gDrag.v=(gDrag.lx-e.clientX)/(cw*.6)/(dt/1000)*.5+gDrag.v*.5}
  gDrag.lx=e.clientX;gDrag.lt=now;placeCards();
});
function endDrag(){
  if(!gDrag)return;var g=gDrag;gDrag=null;ringWrap.classList.remove("grabbing");
  if(g.moved<6){
    if(g.card){
      var i=cards.indexOf(g.card),d=mod(i-pos+N/2,N)-N/2;
      if(Math.abs(d)<.5)openLb(i);else gTarget=Math.round(pos+d);
    }else gTarget=Math.round(pos);
  }else gTarget=Math.round(pos+Math.max(-2,Math.min(2,g.v*.35)));
}
ringWrap.addEventListener("pointerup",endDrag);
ringWrap.addEventListener("pointercancel",endDrag);
ringWrap.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){e.preventDefault();gUser=true;gTarget=Math.round(gTarget)+1}
  else if(e.key==="ArrowLeft"){e.preventDefault();gUser=true;gTarget=Math.round(gTarget)-1}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();openLb(galIdx())}
});
$("#rPrev").addEventListener("click",function(){gUser=true;gTarget=Math.round(gTarget)-1});
$("#rNext").addEventListener("click",function(){gUser=true;gTarget=Math.round(gTarget)+1});
function setupGalleryAuto(){
  if("IntersectionObserver" in window)new IntersectionObserver(function(en){gVisible=en[0].isIntersecting},{threshold:.5}).observe(ringWrap);
  if(!RM)setInterval(function(){if(gVisible&&!gUser&&!lbOpen&&!document.hidden)gTarget=Math.round(gTarget)+1},3600);
}

/* ---- lightbox ---- */
var lb=$("#lb"),lbImg=$("#lbImg"),lbBusy=false;
function lbSet(i){
  lbIdx=mod(i,N);var src=cards[lbIdx].querySelector("img").getAttribute("src");
  lbImg.src=src;lbImg.alt=T[lang].galAlt+(lbIdx+1);$("#lbBg").style.backgroundImage="url("+src+")";
  $("#lbCount").textContent=num(lbIdx+1)+" / "+num(N);
}
function openLb(i){
  lbOpen=true;lbSet(i);lb.hidden=false;void lb.offsetWidth;lb.classList.add("open");
  document.documentElement.style.overflow="hidden";$("#lbClose").focus();
}
function closeLb(){
  if(!lbOpen)return;lbOpen=false;lb.classList.remove("open");
  gTarget=Math.round(pos)+mod(lbIdx-galIdx()+N/2,N)-N/2;
  document.documentElement.style.overflow="";
  setTimeout(function(){if(!lbOpen)lb.hidden=true},350);
}
function lbGo(delta){
  if(lbBusy)return;lbBusy=true;
  lbImg.style.transition="transform .22s ease,opacity .22s ease";
  lbImg.style.transform="translateX("+(-delta*70)+"px)";lbImg.style.opacity="0";
  setTimeout(function(){
    lbSet(lbIdx+delta);lbImg.style.transition="none";lbImg.style.transform="translateX("+(delta*70)+"px)";
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      lbImg.style.transition="transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s ease";lbImg.style.transform="none";lbImg.style.opacity="1";
      setTimeout(function(){lbBusy=false},300);
    })});
  },200);
}
$("#lbClose").addEventListener("click",closeLb);
$("#lbPrev").addEventListener("click",function(){lbGo(-1)});
$("#lbNext").addEventListener("click",function(){lbGo(1)});
document.addEventListener("keydown",function(e){
  if(!lbOpen)return;
  if(e.key==="Escape")closeLb();else if(e.key==="ArrowRight")lbGo(1);else if(e.key==="ArrowLeft")lbGo(-1);
});
(function(){
  var st=$("#lbStage"),sx=0,dx=0,down=false,moved=0;
  st.addEventListener("pointerdown",function(e){down=true;sx=e.clientX;dx=0;moved=0;try{st.setPointerCapture(e.pointerId)}catch(_){}lbImg.style.transition="none"});
  st.addEventListener("pointermove",function(e){if(!down||lbBusy)return;dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));lbImg.style.transform="translateX("+dx+"px) rotate("+(dx/40)+"deg)";lbImg.style.opacity=String(Math.max(.35,1-Math.abs(dx)/420))});
  function up(e){
    if(!down)return;down=false;
    if(moved<6){if(e.target===st||e.target.classList.contains("kb"))closeLb();return}
    if(Math.abs(dx)>70){lbImg.style.transform="none";lbImg.style.opacity="1";lbGo(dx<0?1:-1)}
    else{lbImg.style.transition="transform .3s ease,opacity .3s ease";lbImg.style.transform="none";lbImg.style.opacity="1"}
  }
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
})();

/* ---- RSVP ---- */
var guests=1;
function setGuests(n){guests=Math.max(1,Math.min(10,n));$("#gOut").textContent=num(guests)}
$("#gMinus").addEventListener("click",function(){setGuests(guests-1)});
$("#gPlus").addEventListener("click",function(){setGuests(guests+1)});
function attending(){return $("#att-yes").checked}
$$("input[name=att]").forEach(function(r){r.addEventListener("change",function(){$("#guestsBox").hidden=!attending()})});
var lastMsg="";
function buildReply(){
  var name=$("#rsvp-name").value.trim(),note=$("#rsvp-msg").value.trim();
  lastMsg=T[lang].msg({name:name,att:attending(),n:num(guests),note:note});
  $("#replyText").value=lastMsg;
  $("#waLink").href="https://wa.me/"+(EVENT.whatsapp||"")+"?text="+encodeURIComponent(lastMsg);
}
$("#rsvpForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(!$("#rsvp-name").value.trim()){$("#rsvpErr").textContent=T[lang].errName;$("#rsvp-name").focus();return}
  $("#rsvpErr").textContent="";buildReply();
  if(EVENT.rsvpEndpoint){
    sendRsvp();
  } else {
    rsvpDone(true);
  }
});
function showReply(){$("#rsvpForm").hidden=true;$("#reply").hidden=false}
function rsvpDone(ok){
  var btn=$("#rsvpSubmit");btn.disabled=false;btn.textContent=T[lang].send;
  if(ok){$("#rsvpForm").hidden=true;$("#thanksP").textContent=attending()?T[lang].thanksYes:T[lang].thanksNo;$("#thanks").hidden=false}
  else showReply();
}
function sendRsvp(){
  var btn=$("#rsvpSubmit");btn.disabled=true;btn.textContent=T[lang].sending;
  var body=JSON.stringify({name:$("#rsvp-name").value.trim(),attending:attending(),guests:attending()?guests:0,note:$("#rsvp-msg").value.trim(),lang:lang,sentAt:new Date().toISOString()});
  try{
    fetch(EVENT.rsvpEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
      .then(function(){rsvpDone(true)},function(){rsvpDone(false)});
  }catch(e){rsvpDone(false)}
}
$("#againBtn").addEventListener("click",function(){$("#thanks").hidden=true;$("#rsvpForm").hidden=false;$("#rsvp-name").value="";$("#rsvp-msg").value="";$("#rsvp-name").focus()});
$("#editBtn").addEventListener("click",function(){$("#reply").hidden=true;$("#rsvpForm").hidden=false;$("#rsvp-name").focus()});
$("#copyBtn").addEventListener("click",function(){
  var b=$("#copyBtn"),ta=$("#replyText");
  function done(ok){b.textContent=ok?T[lang].copied:T[lang].copyManual;if(!ok){ta.focus();ta.select()}setTimeout(function(){b.textContent=T[lang].copy},2200)}
  try{navigator.clipboard.writeText(lastMsg).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
});

/* ---- boot ---- */
applyLang(lang);readCols();sizeFx();initFx();layoutMaze();
var rt=null;
window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){sizeFx();initFx();layoutMaze();if(inviteOpen)sizeRing()},150)});
var last=performance.now();
function loop(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;
  if(!document.hidden){stepFx(dt,t);if(mazeActive||(won&&!inviteOpen))drawMaze(t,dt);if(inviteOpen)galStep(dt)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
